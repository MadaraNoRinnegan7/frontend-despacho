server {
    listen 8080;
    server_name _;

    # Carpeta donde están los archivos compilados de React
    root /usr/share/nginx/html;
    index index.html;

    # Necesario para React Router: si la ruta no existe como archivo,
    # sirve index.html y React maneja el routing del lado del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso al backend: las llamadas a /api/* se reenvían al backend
    # Esto evita problemas de CORS porque el navegador ve todo como mismo origen
    location /api/ {
        proxy_pass http://backend-despachos:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Caché de archivos estáticos (JS, CSS, imágenes) por 1 año
    # Vite genera nombres únicos con hash, así es seguro cachear agresivamente
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compresión gzip para reducir tamaño de respuestas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
