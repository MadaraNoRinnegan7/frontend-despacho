name: Deploy Frontend to ECS

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_BACKEND_URL=${{ secrets.BACKEND_URL }} \
            -t $ECR_REGISTRY/frontend-despacho:latest \
            -t $ECR_REGISTRY/frontend-despacho:$IMAGE_TAG .
          docker push $ECR_REGISTRY/frontend-despacho:latest
          docker push $ECR_REGISTRY/frontend-despacho:$IMAGE_TAG

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster innovatech-cluster \
            --service frontend-service \
            --force-new-deployment
